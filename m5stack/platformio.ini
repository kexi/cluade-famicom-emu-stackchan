[env:m5stack-cores3]
platform = espressif32@^6.7.0
board = m5stack-cores3
framework = arduino
lib_deps =
    m5stack/M5Unified@^0.2.2
    nes-core=symlink://../core
build_unflags = -std=gnu++11 -Os
build_flags = -std=gnu++17 -O2 -DNES_EMBEDDED -DBOARD_HAS_PSRAM
board_build.embed_files = data/game.nes
monitor_speed = 115200

; 計測ビルド。NES_PROFILE は catchUp() 内の xthal_get_ccount() 計測と
; 毎秒の apu=/ppu=/cpu= 内訳ログを有効にする。観測コストを本番から
; 分離するため opt-in — 内訳が要るときだけ `just flash-profile` で焼く
[env:m5stack-cores3-profile]
extends = env:m5stack-cores3
build_flags = ${env:m5stack-cores3.build_flags} -DNES_PROFILE
