# 検証が依存する ROM 固有の値。fetch_rom.sh と justfile の verify が両方ここを読む。
#
# ここに 2 つを並べているのは、両者が必ずセットで動くため。just verify の fb 差分
# 許容窓 (known_line) は game.nes がスクロール分割を行うスキャンラインそのもので、
# 別の ROM に対しては何の意味も持たない。ハッシュだけ更新して窓を据え置くと、
# verify は既知の差分を誤って FAIL と呼ぶか、逆に本物の desync を見逃す。
#
# ROM を差し替えるときは両方引き直すこと。同じファイルに置いてあるのは、
# 片方だけ直して気づかない状況を作らないため。
#
# 書式: KEY=VALUE の素朴な行。sh も awk も grep も読めるように、引用符も
# 継続行も入れない。'#' 始まりと空行は無視される。

# 取得元の game.nes (main ブランチを追う URL なので上流が差し替われば中身が変わる)
ROM_SHA256=6cd4e6052a16ce014cbd0f175830b77ebe4b236615409f2156de00179cc8311d

# fb 差分の許容窓。組み込み側の renderScanline() が 1 ライン分を dot 256 で一括
# 描画するのに対し参照側の renderDot() が逐次フェッチするため、この ROM が
# scanline 135 で行うライン途中のレジスタ書き換えが、そのラインの最後のタイルの
# 取り込みタイミングとしてしか現れない。
#
# KNOWN_X=248 の側はタイル境界なので構造的だが、KNOWN_LINE は完全にゲーム依存。
KNOWN_LINE=135
KNOWN_X=248
